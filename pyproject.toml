[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raildelay"
version = "0.1.0"
description = "Reproducible exploration of NRW railway delay archives"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<4", "pyarrow==25.0.1", "matplotlib>=3.9,<4", "numpy>=1.26,<3",
    "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
